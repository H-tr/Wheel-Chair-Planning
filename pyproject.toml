[build-system]
requires = [
    "scikit-build-core>=0.11",
    "Cython>=3.1",
    "numpy>=2",
    "nanobind>=2.9",
]
build-backend = "scikit_build_core.build"

[project]
name = "wheelchair_planning"
version = "0.4.0"
description = "Wheelchair planning module"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# Keep this list minimal: everything here must install from PyPI wheels.
# TOPP-RA is vendored from third_party/toppra and compiled into our
# wheels, so only its numpy/scipy runtime deps are listed.
dependencies = [
    "numpy>=2",
    "scipy",
    # Symbolic FK for Constraint / Cost (wheelchair_planning.planning.symbolic).
    "casadi",
]

[project.urls]
Homepage = "https://github.com/H-tr/Wheel-Chair-Planning"
Repository = "https://github.com/H-tr/Wheel-Chair-Planning"
Issues = "https://github.com/H-tr/Wheel-Chair-Planning/issues"

[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = [
    "wheelchair_planning",
    "third_party/toppra/python/toppra",
]
wheel.license-files = ["third_party/toppra/LICENSE"]

# Keep sdist lean enough for PyPI's 100 MB limit.
# Only ship what's needed to rebuild the wheel from source:
#   - Python sources + package resources (URDFs, meshes shipped with
#     wheelchair_planning)
#   - CMake sources under ext/
#   - third_party/ompl sources (compiled from source) minus docs/demos/tests
#   - third_party/vamp cmake + header-only src (resources/ and build/ are not
#     needed to compile)
#   - third_party/toppra Python package + Cython sources used for time
#     parameterization
# Everything else — examples, demos, docs, mkdocs output, repo-level assets,
# the cricket / foam submodules (used only by scripts, never by the wheel
# build) — is excluded.
sdist.exclude = [
    # Repo-level non-build content
    "assets/",
    "docs/",
    "site/",
    "examples/",
    "tests/",
    "scripts/",
    "tools/",
    "build/",
    "dist/",
    ".pixi/",
    ".pytest_cache/",
    ".claude/",
    ".vscode/",
    ".coverage",
    "pixi.lock",
    "pixi.toml",

    # Unused third-party trees (only consumed by build_robot scripts)
    "third_party/cricket/",
    "third_party/foam/",

    # OMPL: ship only what the build links against
    "third_party/ompl/doc/",
    "third_party/ompl/tests/",
    "third_party/ompl/demos/",
    "third_party/ompl/py-bindings/",
    "third_party/ompl/scripts/",

    # VAMP: header-only, CMake needs cmake/ + src/impl/ only
    "third_party/vamp/resources/",
    "third_party/vamp/build/",
    "third_party/vamp/docker/",
    "third_party/vamp/scripts/",

    # TOPP-RA: only the Python runtime under python/toppra is packaged
    "third_party/toppra/.github/",
    "third_party/toppra/cpp/",
    "third_party/toppra/dockerfiles/",
    "third_party/toppra/docs/",
    "third_party/toppra/examples/",
    "third_party/toppra/examples-old/",
    "third_party/toppra/medias/",
    "third_party/toppra/tests/",
]

[project.optional-dependencies]
# wheelchair_planning.kinematics: pinocchio FK / collision model and the
# Pink IK solver (Pink solves its QPs with OSQP through qpsolvers, which
# bundles no solver backend itself).  The TRAC-IK solver additionally needs
# the compiled ``pytracik`` extension, which is only built when orocos-kdl
# and NLopt are available (e.g. the pixi environment).
kinematics = ["pin>=3.3", "pin-pink", "osqp"]
# wheelchair_planning.envs and the example scripts.
examples = ["fire", "matplotlib", "pybullet", "xmltodict"]
dev = ["pre-commit", "pytest>=8.0", "trimesh>=4.0"]

# ── cibuildwheel ─────────────────────────────────────────────────────
# Default Linux wheel target: manylinux_2_34 (AlmaLinux 9) x86_64. AVX2
# is required (VAMP/SIMDxorshift), which the default -march=x86-64-v3 in
# CMakeLists.txt targets.
#
# Release and pip-compat workflows also build manylinux_2_28 wheels for
# older glibc systems. That path has to provide a newer Boost explicitly:
# OMPL requires Boost >= 1.68, while EL8 ships Boost 1.66.
[tool.cibuildwheel]
# Full supported-Python range (must match requires-python and the
# pip-compat / release workflow matrices).
build = "cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686 pp* cp3??t-*"
build-verbosity = 1
archs = ["x86_64"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
before-all = "dnf install -y boost-devel eigen3-devel"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Silence third-party noise — none of these come from our code:
#   * osqp's PendingDeprecationWarning fires once per QP iteration
#     during Pink IK solves (~50–300× per test)
#   * qpsolvers' SparseConversionWarning is a perf hint to Pink for
#     handing it dense matrices instead of CSC
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning:osqp",
    "ignore::Warning:qpsolvers",
]
